# Configuration de test avec base de données H2 en mémoire
spring.application.name=appstreaming

# ========================================
# Configuration Base de Données H2 (Test)
# ========================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA/Hibernate pour tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ========================================
# Configuration Flyway (Désactivé en test)
# ========================================
spring.flyway.enabled=false

# ========================================
# Configuration Logging (DEBUG pour tests)
# ========================================
logging.level.root=INFO
logging.level.com.fstm.ma.ilisi.appstreaming=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# Configuration JWT (Test)
# ========================================
jwt.secret=test-secret-key-for-unit-and-integration-tests-should-be-at-least-256-bits
jwt.expiration=3600000

# ========================================
# Configuration Ant Media Server (Test - Mock)
# ========================================
ant.media.server.url=http://localhost:5080
ant.media.server.app.name=WebRTCAppEE
ant.media.rest.api.url=http://localhost:5080/WebRTCAppEE/rest
ant.media.webhook.secret=test-webhook-secret

# ========================================
# Configuration Upload (Test)
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=target/test-uploads/

# ========================================
# Configuration Cache (Désactivé en test)
# ========================================
spring.cache.type=none

# ========================================
# Configuration Resilience4j (Test)
# ========================================
resilience4j.circuitbreaker.instances.antMediaService.sliding-window-size=5
resilience4j.circuitbreaker.instances.antMediaService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.antMediaService.wait-duration-in-open-state=10000

resilience4j.retry.instances.antMediaService.max-attempts=2
resilience4j.retry.instances.antMediaService.wait-duration=1000

# ========================================
# Configuration Swagger (Activé pour tests d'intégration)
# ========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ========================================
# Configuration Actuator (Test)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ========================================
# Configuration Spring Security (Test)
# ========================================
spring.security.user.name=test
spring.security.user.password=test

# ========================================
# Configuration Mail (Test - Désactivé)
# ========================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
app.mail-from=test@test.com
app.frontend-url=http://localhost:3000

# ========================================
# Configuration Ant Media Server (Test - Mock)
# ========================================
antmedia.server.base-url=http://localhost:5080
antmedia.server.app=WebRTCAppEE
storage.replay-url=http://localhost:5080/replays
storage.type=local
