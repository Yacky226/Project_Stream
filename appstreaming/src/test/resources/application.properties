# Configuration de test avec base de donnÃ©es H2 en mÃ©moire
spring.application.name=appstreaming

# ========================================
# Configuration Base de DonnÃ©es H2 (Test)
# ========================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA/Hibernate pour tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ========================================
# Configuration Flyway (DÃ©sactivÃ© en test)
# ========================================
spring.flyway.enabled=false

# ========================================
# Configuration Logging (DEBUG pour tests)
# ========================================
logging.level.root=INFO
logging.level.com.fstm.ma.ilisi.appstreaming=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# Configuration JWT (Test)
# ========================================
jwt.secret=test-secret-key-for-unit-and-integration-tests-should-be-at-least-256-bits
jwt.expiration=3600000

# ========================================
# Configuration Upload (Test)
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=target/test-uploads/

# ========================================
# Configuration Cache (DÃ©sactivÃ© en test)
# ========================================
spring.cache.type=none

# ========================================
# Configuration Swagger (ActivÃ© pour tests d'intÃ©gration)
# ========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ========================================
# Configuration Actuator (Test)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ========================================
# Configuration Spring Security (Test)
# ========================================
spring.security.user.name=test
spring.security.user.password=test

# ========================================
# Configuration Mail (Test - DÃ©sactivÃ©)
# ========================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
app.mail-from=test@test.com
app.frontend-url=http://localhost:3000

livekit.ws-url=ws://localhost:7880
livekit.api-key=test-api-key
livekit.api-secret=test-api-secret
livekit.meet-base-url=https://meet.livekit.io
storage.replay-url=http://localhost:8080/replays
storage.type=local

