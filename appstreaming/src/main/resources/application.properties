# ========== Profil actif par defaut ==========
# Charge automatiquement les variables locales du fichier .env si present.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ========== Base de donnees PostgreSQL ==========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / Hibernate ==========
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========== Flyway Migrations ==========
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========== Logging ==========
logging.level.org.springframework.web=INFO
logging.level.com.fstm.ma.ilisi=INFO
# Format de log avec traceId pour le suivi des requêtes
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%X{clientIp}] %-5level %logger{36} - %msg%n

# ========== Upload fichiers ==========
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ========== Envoi des mails ==========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail-from=${MAIL_FROM}
app.frontend-url=${FRONTEND_URL}
app.support-email=${SUPPORT_EMAIL:${MAIL_FROM}}
app.mail.fail-on-error=true

# ========== Chatbot AI Providers ==========
chatbot.providers.openai.api-key=${OPENAI_API_KEY:}
chatbot.providers.anthropic.api-key=${ANTHROPIC_API_KEY:}
chatbot.providers.gemini.api-key=${GEMINI_API_KEY:}
chatbot.providers.openai.default-model=${CHATBOT_OPENAI_MODEL:gpt-4o-mini}
chatbot.providers.anthropic.default-model=${CHATBOT_ANTHROPIC_MODEL:claude-3-5-sonnet-latest}
chatbot.providers.gemini.default-model=${CHATBOT_GEMINI_MODEL:gemini-2.5-flash}

# ========== Streaming Provider ==========
streaming.provider=${STREAMING_PROVIDER:livekit}

# ========== LiveKit ==========
livekit.ws-url=${LIVEKIT_WS_URL:${LIVEKIT_URL:}}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
livekit.meet-base-url=${LIVEKIT_MEET_BASE_URL:https://meet.livekit.io}

# ========== Ant Media Server ==========
antmedia.server.base-url=${ANTMEDIA_URL:http://localhost:5080}
antmedia.server.app=${ANTMEDIA_APP:LiveApp}

# ========== Replays ==========
storage.replay-url=${REPLAY_URL}

# ========== Stockage de Fichiers ==========
# Type de stockage: local, s3, cloudinary
storage.type=local

# Configuration stockage local (par d\u00e9faut)
storage.local.base-path=src/main/resources/static/Uploads

# Configuration S3/MinIO (activer avec storage.type=s3)
#storage.s3.access-key=YOUR_ACCESS_KEY
#storage.s3.secret-key=YOUR_SECRET_KEY
#storage.s3.bucket-name=appstreaming-files

# ========== Resilience4j (Circuit Breaker & Retry) ==========
resilience4j.circuitbreaker.instances.antMediaService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.antMediaService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.antMediaService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.antMediaService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.antMediaService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.antMediaService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.antMediaService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.antMediaService.eventConsumerBufferSize=10

resilience4j.retry.instances.antMediaService.maxAttempts=3
resilience4j.retry.instances.antMediaService.waitDuration=1s
resilience4j.retry.instances.antMediaService.enableExponentialBackoff=true
resilience4j.retry.instances.antMediaService.exponentialBackoffMultiplier=2
#storage.s3.region=us-east-1
# Pour MinIO, d\u00e9commenter et configurer l'endpoint
#storage.s3.endpoint=http://localhost:9000
#storage.s3.public-url=http://localhost:9000/appstreaming-files

# Configuration Cloudinary (activer avec storage.type=cloudinary)
#storage.cloudinary.cloud-name=YOUR_CLOUD_NAME
#storage.cloudinary.api-key=YOUR_API_KEY
#storage.cloudinary.api-secret=YOUR_API_SECRET

# ========== S\u00e9curit\u00e9 Webhook ==========
# Secret partag\u00e9 pour valider les webhooks Ant Media
antmedia.webhook.secret=change-this-secret-in-production

# Whitelist IP pour webhooks (s\u00e9par\u00e9es par virgules)
#antmedia.webhook.allowed-ips=172.30.244.68,127.0.0.1

# ========== Spring Actuator (Health Checks & Monitoring) ==========
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true
management.info.env.enabled=true

# Info de l application
info.app.name=AppStreaming
info.app.description=Application de streaming educatif
info.app.version=1.0.0

# ========== OpenAPI / Swagger ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# ========== JWT Configuration ==========
# Clé secrète pour signer les tokens (doit être >= 256 bits pour HMAC-SHA)
jwt.secret=${JWT_SECRET:defaultDevSecretKeyForJWT1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZab}
# 1 heure
jwt.access-token.expiration=3600000
# 7 jours
jwt.refresh-token.expiration=604800000
jwt.refresh-token.max-sessions=5
