# ========================================
# Configuration PROD - Production
# ========================================
# IMPORTANT: Toutes les valeurs sensibles doivent être fournies via variables d'environnement

# ========== JPA / Hibernate PROD ==========
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========== Logging PROD ==========
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.com.fstm.ma.ilisi=INFO
logging.file.name=logs/appstreaming.log
logging.file.max-size=10MB
logging.file.max-history=30

# ========== Mail PROD ==========
# Toutes les valeurs doivent venir des variables d'environnement
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.fail-on-error=true

# ========== Flyway PROD ==========
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ========== Actuator PROD ==========
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ========== Security Headers PROD ==========
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ========== Compression PROD ==========
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# ========== JWT PROD ==========
# 1 heure
jwt.access-token.expiration=3600000
# 7 jours
jwt.refresh-token.expiration=604800000
# Limite en prod
jwt.refresh-token.max-sessions=3

# ========== Swagger PROD (désactivé) ==========
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ========== Cache PROD ==========
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

# ========== Connection Pool PROD ==========
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

