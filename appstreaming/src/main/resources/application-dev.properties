# ========================================
# Configuration DEV - Développement Local
# ========================================

# ========== Base de données PostgreSQL DEV ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/stream
spring.datasource.username=yacouba
spring.datasource.password=yacouba

# ========== JPA / Hibernate DEV ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ========== Logging DEV ==========
logging.level.org.springframework.web=DEBUG
logging.level.com.fstm.ma.ilisi=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========== Local probe silencing ==========
app.dev.silent-v2-probes=true

# ========== Mail DEV (console ou MailHog) ==========
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail-from=noreply@localhost
app.frontend-url=http://localhost:3000
app.support-email=support@localhost
app.mail.fail-on-error=false

# ========== Ant Media Server DEV ==========
antmedia.server.base-url=http://localhost:5080
antmedia.server.app=LiveApp

# ========== Streaming Provider DEV ==========
streaming.provider=${STREAMING_PROVIDER:livekit}

# ========== Replays DEV ==========
storage.replay-url=http://localhost:5080/LiveApp/streams

# ========== Sécurité Webhook DEV ==========
antmedia.webhook.secret=dev-secret-key-not-for-production

# ========== Flyway DEV ==========
spring.flyway.enabled=false

# ========== Actuator DEV ==========
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ========== JWT DEV ==========
jwt.secret=devSecretKeyForJWT1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnop
# 24 heures en dev
jwt.access-token.expiration=86400000
# 30 jours en dev
jwt.refresh-token.expiration=2592000000

# ========== Swagger DEV ==========
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ========== CORS DEV ==========
# Géré dans SecurityConfig pour localhost:5173

# Seed DEV
app.dev.seed.enabled=true
